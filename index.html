<head>

                   user-scalable=no,
                   maximum-scale=1,
                   width=device-width">

    <meta name="mobile-web-app-capable" content="yes">

    <meta name="apple-mobile-web-app-capable" content="yes">

    <meta name="theme-color" content="#1b5e20">

    <meta name="description"
          content="Central Equatoria Geographic Information System">

    <title>
        Central Equatoria GIS
    </title>


    <!-- =========================
         CSS FILES
    ========================== -->

    <link rel="stylesheet"
          href="ol.css">

    <link rel="stylesheet"
          href="fontawesome-all.min.css">

    <link rel="stylesheet"
          href="photon-geocoder-autocomplete.min.css">

    <link rel="stylesheet"
          href="ol-layerswitcher.css">

    <link rel="stylesheet"
          href="qgis2web.css">


    <!-- =========================
         CUSTOM CSS
    ========================== -->

    <style>

        html,
        body {

            margin: 0;

            padding: 0;

            width: 100%;

            height: 100%;

            overflow: hidden;

            background-color: #ffffff;

            font-family: Arial, sans-serif;

        }


        /* MAP */

        #map {

            width: 100%;

            height: 100vh;

            position: relative;

        }


        /* OPENLAYERS CONTROLS */

        .ol-control > * {

            background-color: #f8f8f8 !important;

            color: #444444 !important;

            border-radius: 3px;

        }


        .ol-control > *:hover {

            background-color: #ffffff !important;

        }


        .ol-control {

            background-color: rgba(255,255,255,0.4) !important;

            padding: 2px !important;

        }


        /* SEARCH PLACEHOLDER */

        .gcd-gl-input::placeholder {

            color: #444444 !important;

        }


        .search-layer-input-search::placeholder {

            color: #444444 !important;

        }


        .search-layer-input-search {

            background-color: #f8f8f8 !important;

        }


        /* ATTRIBUTION */

        .ol-attribution a {

            color: #444444 !important;

        }


        /* POPUP */

        .ol-popup {

            position: absolute;

            background-color: white;

            box-shadow: 0 1px 4px rgba(0,0,0,0.3);

            padding: 15px;

            border-radius: 10px;

            border: 1px solid #cccccc;

            bottom: 12px;

            left: -50px;

            min-width: 280px;

        }


        .ol-popup:after,
        .ol-popup:before {

            top: 100%;

            border: solid transparent;

            content: " ";

            height: 0;

            width: 0;

            position: absolute;

            pointer-events: none;

        }


        .ol-popup:after {

            border-top-color: white;

            border-width: 10px;

            left: 48px;

            margin-left: -10px;

        }


        .ol-popup:before {

            border-top-color: #cccccc;

            border-width: 11px;

            left: 48px;

            margin-left: -11px;

        }


        .ol-popup-closer {

            text-decoration: none;

            position: absolute;

            top: 2px;

            right: 8px;

        }


        .ol-popup-closer:after {

            content: "✖";

        }


        /* TITLE */

        .gis-title {

            position: absolute;

            top: 15px;

            left: 50%;

            transform: translateX(-50%);

            z-index: 1000;

            background: rgba(27,94,32,0.95);

            color: white;

            padding: 10px 25px;

            border-radius: 5px;

            font-size: 20px;

            font-weight: bold;

            box-shadow: 0 2px 6px rgba(0,0,0,0.3);

            pointer-events: none;

        }


        /* MOBILE TITLE */

        @media screen and (max-width: 600px) {

            .gis-title {

                font-size: 15px;

                padding: 8px 15px;

            }

        }

    </style>

</head>


<body>


    <!-- =========================
         MAP CONTAINER
    ========================== -->

    <div id="map">


        <!-- MAP POPUP -->

        <div id="popup"
             class="ol-popup">

            <a href="#"
               id="popup-closer"
               class="ol-popup-closer">
            </a>

            <div id="popup-content">
            </div>

        </div>


        <!-- MAP TITLE -->

        <div class="gis-title">

            Central Equatoria GIS

        </div>


    </div>
